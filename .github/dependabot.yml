# Only ecosystems that exist in the repository today. A Dependabot entry for a
# directory that does not exist raises errors, so the terraform, docker and
# helm entries are added in the phase that introduces those files.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
